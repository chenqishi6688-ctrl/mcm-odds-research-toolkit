[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcm-odds-research-toolkit"
version = "0.1.0"
description = "Auditable football probability and market-structure research toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "MCM contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Documentation = "https://github.com/chenqishi6688-ctrl/mcm-odds-research-toolkit"
Source = "https://github.com/chenqishi6688-ctrl/mcm-odds-research-toolkit"
Issues = "https://github.com/chenqishi6688-ctrl/mcm-odds-research-toolkit/issues"

[tool.setuptools]
packages = []


